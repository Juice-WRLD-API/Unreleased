<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Vite builds with base './' so the Electron build can find its assets
         over file://. On the web that relative base is resolved against the
         current path, which breaks every nested route: from
         /auth/discord/callback the browser asks for
         /auth/discord/assets/index-*.js, gets a 404, and renders nothing -
         a blank page right after Discord login (same for /shared/<id>).
         Over http(s) repoint the base at the origin root before the parser
         reaches the injected module script; file:// keeps the relative base. -->
    <base href="./" />
    <script>if(/^https?:/.test(location.protocol))document.querySelector('base').href='/'</script>
    <!-- maximum-scale=1 stops iOS Safari's auto-zoom when focusing inputs
         under 10px (all our text-xs fields); deliberate pinch-zoom still
         works - iOS ignores the cap for user gestures. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Nothing in this app needs remote script/style execution, eval, or a
         plugin/object embed, so this closes off the main injection→escalation
         path for a compromised dependency or an XSS in rendered content
         (react-markdown here is already sanitized - see lib/Markdown.tsx -
         this is the second layer). The inline <script> blocks below are
         pinned by hash rather than 'unsafe-inline'; if any of them changes,
         its hash here has to be recomputed or it silently stops running (the
         CSP violation shows as a console error, not a crash). Two of the
         pinned hashes are ours (base-href fixup, SEO); the third
         (sha256-DalSI...) plus static.cloudflareinsights.com are Cloudflare's
         own Web Analytics beacon, injected at the edge, not shipped in this
         file - if Cloudflare rotates that snippet this hash will need
         updating too. 'wasm-unsafe-eval' is scoped to WebAssembly
         instantiation only (not plain eval/new Function) and is required by
         libsodium-wrappers, which the staff chat E2E crypto
         (lib/chatCrypto.ts) loads as WASM. local-media: is the custom scheme
         the desktop build streams local audio/video through (see
         electron/main.js); it's a no-op origin on the web build. connect-src
         lists every host the renderer actually calls: the API, its
         match-play websocket, Last.fm scrobbling, the two lyrics CORS
         proxies (see EditorPage.tsx), the image CORS proxies coverImage.ts
         falls back to for the API's non-CORS /assets/ covers,
         Cloudflare's beacon report endpoint, and the Tenor/Giphy GIF search
         + media hosts (see gifApi.ts) - plus data:/blob:, since fetch()
         (unlike a plain <img> src) is governed by connect-src even for those
         schemes, and coverImage.ts (copy/save cover, and ShareLyricsModal's
         export) fetches a cover's own data:/blob: URL right back out to get
         bytes it can embed, not to reach any actual network origin. -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'wasm-unsafe-eval' 'sha256-xjpTVCo7o4K9QG8ZmAgfjVUbc2OdYbdKgT/ClSf5AWE=' 'sha256-b1jw+VU6Z+2+MRzlWRKIER82x08obZjR7Y3a9A7hu74=' 'sha256-DalSI+ICv7kcV+43N8QN6XuXql+ZJwy3Yj2YOF8AtBA=' https://static.cloudflareinsights.com;
      style-src 'self';
      img-src 'self' data: blob: local-media: https:;
      media-src 'self' blob: local-media: https:;
      font-src 'self';
      connect-src 'self' data: blob: https://juicewrldapi.com wss://juicewrldapi.com https://ws.audioscrobbler.com https://api.allorigins.win https://corsproxy.io https://images.weserv.nl https://api.github.com https://cloudflareinsights.com https://tenor.googleapis.com https://*.tenor.com https://api.giphy.com https://*.giphy.com local-media:;
      worker-src 'self';
      object-src 'none';
      base-uri 'self';
      form-action 'self';
    " />

    <!-- SEO - web build only in effect, though the tags ship in the packaged
         HTML too (same bundle, same index.html; they are inert there, exactly
         like the PWA tags below). These are what every non-JS scraper reads -
         Discord/Twitter/iMessage unfurls included - so they describe the site
         as a whole. Once React boots, lib/seo.ts rewrites
         title/description/canonical/robots per route; see applySeo(), which
         no-ops in Electron. -->
    <meta name="description" content="Stream Juice WRLD's full catalog - every released and unreleased song - free in your browser. Search by era, producer or engineer, build playlists, listen to 999 FM radio, and read synced lyrics." />
    <link rel="canonical" href="https://player.juicewrldapi.com/" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />

    <meta property="og:site_name" content="unreleased" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://player.juicewrldapi.com/" />
    <meta property="og:title" content="unreleased - Juice WRLD music player" />
    <meta property="og:description" content="Stream Juice WRLD's full catalog - every released and unreleased song - free in your browser. Search by era, producer or engineer, build playlists, listen to 999 FM radio, and read synced lyrics." />
    <meta property="og:image" content="https://player.juicewrldapi.com/icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="unreleased - Juice WRLD music player" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="unreleased - Juice WRLD music player" />
    <meta name="twitter:description" content="Stream Juice WRLD's full catalog - every released and unreleased song - free in your browser. Search by era, producer or engineer, build playlists, listen to 999 FM radio, and read synced lyrics." />
    <meta name="twitter:image" content="https://player.juicewrldapi.com/icon-512.png" />

    <!-- PWA / installability. These are inert in the Electron build (it loads
         over file://, never installs, and the service worker is not registered
         there - see main.tsx). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#121212" />
    <!-- iOS ignores the web manifest for "Add to Home Screen" - it reads these
         Apple-specific tags instead to launch fullscreen with our own icon. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- black-translucent lets the page paint under the status bar, which is
         what keeps the skin/gradient running to the very top edge.
         Known and not ours to fix: iOS softens the top of the screen in
         installed apps regardless of page content - every installed PWA shows
         it, so don't go hunting for a CSS blur in here. Only the viewer's
         Settings → Accessibility → Reduce Transparency changes it. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Unreleased" />
    <link rel="apple-touch-icon" href="/icon-512.png" />

    <title>unreleased - Juice WRLD music player</title>

    <!-- Structured data. WebSite carries the SearchAction so a Google sitelinks
         search box can deep-link into the tracker's ?q= param (the tracker
         already reflects each settled search there). WebApplication describes
         the player itself - free, browser-based, no install. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://player.juicewrldapi.com/#website",
          "url": "https://player.juicewrldapi.com/",
          "name": "unreleased",
          "description": "A music player for Juice WRLD - stream the full catalog of released and unreleased songs.",
          "inLanguage": "en",
          "potentialAction": {
            "@type": "SearchAction",
            "target": {
              "@type": "EntryPoint",
              "urlTemplate": "https://player.juicewrldapi.com/tracker?q={search_term_string}"
            },
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "WebApplication",
          "@id": "https://player.juicewrldapi.com/#app",
          "name": "unreleased",
          "url": "https://player.juicewrldapi.com/",
          "applicationCategory": "MultimediaApplication",
          "operatingSystem": "Web, Windows, macOS, Linux",
          "browserRequirements": "Requires JavaScript",
          "isPartOf": { "@id": "https://player.juicewrldapi.com/#website" },
          "about": { "@type": "MusicGroup", "name": "Juice WRLD" },
          "featureList": [
            "Search the full released and unreleased catalog",
            "Filter by era, category, producer and engineer",
            "Gapless playback and radio mode",
            "Synced lyrics",
            "Playlists, folders and liked songs",
            "999 FM live radio",
            "10-band equalizer and audio effects",
            "Last.fm scrobbling"
          ],
          "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "USD"
          }
        }
      ]
    }
    </script>
    <!-- Apply saved theme before React renders to prevent flash -->
    <script>
      try {
        const t = localStorage.getItem('wavelength-theme')
        if (t !== 'light') document.documentElement.classList.add('dark')
      } catch(_) {
        document.documentElement.classList.add('dark')
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Crawlers that don't execute JS (and the ones that do, before the bundle
         resolves) otherwise see an empty <div id="root">. This gives them real
         text and crawlable links to the public routes. Never reaches a real
         visitor - or the desktop app, where scripting is always on. -->
    <noscript>
      <h1>unreleased - a Juice WRLD music player</h1>
      <p>
        Stream Juice WRLD's full catalog - every released and unreleased song - free in your
        browser. Search by era, producer or engineer, build playlists, listen to 999 FM radio,
        and read synced lyrics. Powered by the
        <a href="https://juicewrldapi.com">Juice WRLD API</a>.
      </p>
      <p>This player needs JavaScript enabled.</p>
      <ul>
        <li><a href="/tracker">Tracker - search the catalog</a></li>
        <li><a href="/files">Files - browse the API filesystem</a></li>
        <li><a href="/wrld">WRLD - 999 FM live radio</a></li>
        <li><a href="/heardle">Heardle - the daily song guessing game</a></li>
        <li><a href="/wordle">Wordle - the daily song title game</a></li>
        <li><a href="/docs">Docs</a></li>
        <li><a href="/download">Download the desktop app</a></li>
      </ul>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
